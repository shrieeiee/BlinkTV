# The blink-live bridge from softstaticx/blink-tizen-security-dashboard (GPL-3.0),
# built straight from their repo, unmodified. Run this on any always-on box on
# the same network as the TV (the Jellyfin box is ideal):
#
#   docker compose up -d --build
#
# Then open http://THAT_BOX_IP:8099/setup once to link your Blink account.

services:
  blink-live:
    build: https://github.com/softstaticx/blink-tizen-security-dashboard.git#main
    container_name: blink-live
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - blink-live-data:/data
    environment:
      TZ: Europe/London
      LOG_LEVEL: INFO
      BLINK_AUDIO: "1"
      BLINK_AUDIO_TRACK: "0"
      MAX_LIVE_SECONDS: "285"
      # Optional shared secret. If you set it, put the same value in the TV app's Settings.
      # BRIDGE_TOKEN: "change-me"
    security_opt:
      - no-new-privileges:true

volumes:
  blink-live-data:
