plugins { id 'com.android.application' }

android {
    namespace 'com.shrieeiee.blinktv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shrieeiee.blinktv'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // No shrinking: the APK lives on a TV, size doesn't matter and R8 + Media3 is one more thing to go wrong.
            minifyEnabled false
            // Signed with the debug key so the release APK sideloads straight away.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.annotation:annotation-experimental:1.4.1"
}
